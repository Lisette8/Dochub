<style>

    font-weight: 600;
    font-size: 0.86rem;
    color: #334155;
    margin-bottom: 6px;

  .field input[type=text],
  .field input[type=date],
  .field input[type=email],
  .field input[type=password],
  .field select,
  .field textarea,
  input[type=date],
  select {

  }

  .field select,
