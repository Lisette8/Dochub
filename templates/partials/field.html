<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.errors %}
    <div class="field-error">{{ field.errors.0 }}</div>
  {% endif %}

  {% if show_help and field.help_text %}<div class="field-help">{{ field.help_text }}</div>{% endif %}
  {% for e in field.errors %}<div class="field-error">{{ e }}</div>{% endfor %}
</div>
